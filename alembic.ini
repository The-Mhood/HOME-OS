[alembic]
script_location = alembic
prepend_sys_path = backend
# sqlalchemy.url is resolved dynamically by alembic/env.py:
#   1. HOMEOS_DATABASE_URL env var (CI/CD), or
#   2. the app Settings default (HOMEOS_DATA_DIR or ~/.local/share/home-os/data/home_os.db)
# Do NOT hardcode a default here: it silently writes outside the app's data dir.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
