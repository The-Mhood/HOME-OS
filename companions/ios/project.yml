name: HomeOsCompanion
options:
  bundleIdPrefix: com.homeos
  deploymentTarget:
    iOS: "17.0"
targets:
  HomeOsCompanion:
    type: application
    platform: iOS
    sources:
      - Sources/HomeOsCompanion
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSHomeKitUsageDescription: "HOME OS discovers and controls HomeKit & Matter accessories you authorize."
        NSAppleMusicUsageDescription: "HOME OS displays and controls your active system media session when permitted."
        NSLocalNetworkUsageDescription: "HOME OS connects over encrypted TLS to your local HOME OS desktop command centre."
        NSBonjourServices:
          - _homeos._tcp
    entitlements:
      path: Resources/HomeOsCompanion.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.developer.matter.allow-setup-payload: true
