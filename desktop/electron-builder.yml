appId: com.homeos.commandcentre
productName: HOME OS
copyright: Copyright © 2026 HOME OS Engineering
directories:
  output: release-builds
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: ../backend
    to: backend
  - from: ../alembic
    to: alembic
  - from: ../alembic.ini
    to: alembic.ini
linux:
  target:
    - AppImage
    - deb
  category: System
  maintainer: engineering@home-os.local
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  hardenedRuntime: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
