appId: com.homeos.commandcentre
productName: HOME OS
copyright: Copyright © 2026 HOME OS Engineering
directories:
  output: release-builds
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: dist
    to: ui-dist
  - from: ../backend
    to: backend
  - from: ../alembic
    to: alembic
  - from: ../alembic.ini
    to: alembic.ini
linux:
  target:
    - AppImage
    - deb
  category: System
  maintainer: engineering@home-os.local
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: "-"
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSLocalNetworkUsageDescription: "HOME OS discovers and pairs with your authorized phones, TVs, speakers, and smart-home devices on your local Wi-Fi network."
    NSBonjourServices:
      - "_homeos._tcp"
      - "_androidtvremote2._tcp"
      - "_googlecast._tcp"
      - "_airplay._tcp"
      - "_raop._tcp"
      - "_companion-link._tcp"
      - "_hap._tcp"
      - "_matter._tcp"
      - "_home-assistant._tcp"
      - "_sonos._tcp"
      - "_smb._tcp"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
