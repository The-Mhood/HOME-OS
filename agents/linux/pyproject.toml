[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeos-linux-agent"
version = "2.0.0"
readme = "README.md"
description = "HOME OS Native Linux Device Agent"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
homeos-linux-agent = "homeos_linux_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
